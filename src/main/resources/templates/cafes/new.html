<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('新增咖啡廳')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page narrow">
    <h1>新增咖啡廳</h1>

    <section class="panel" th:if="${mapsApiKey}">
        <h2>從 Google Maps 搜尋</h2>
        <div id="place-search" class="place-search"></div>
        <p id="place-status" class="hint">輸入店名，選擇之後會自動填入下面的資料。</p>
        <button type="button" id="place-clear" class="link" hidden>取消選擇的 Google 地點</button>
    </section>

    <section class="panel">
        <h2 th:if="${mapsApiKey}">確認資料（也可以直接手動輸入）</h2>
        <form id="cafe-form" class="stack" th:action="@{/cafes}" th:object="${form}" method="post" novalidate>
            <p class="notice error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></p>
            <p class="field-error" th:if="${#fields.hasErrors('placeId')}" th:errors="*{placeId}"></p>
            <input type="hidden" th:field="*{placeId}">

            <label for="name">店名</label>
            <input id="name" type="text" th:field="*{name}" maxlength="100" autofocus
                   th:classappend="${#fields.hasErrors('name')} ? 'invalid'">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

            <label for="address">地址</label>
            <input id="address" type="text" th:field="*{address}" maxlength="200"
                   th:classappend="${#fields.hasErrors('address')} ? 'invalid'">
            <p class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
            <p class="hint">店名和地址都必填；兩者都相同的咖啡廳只會有一筆。新增後會等管理員核准，核准前你可以自己刪除。</p>

            <div class="actions">
                <button type="submit">新增</button>
                <a class="button secondary" th:href="@{/}">取消</a>
            </div>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: mapsScripts}"></th:block>
</body>
</html>
