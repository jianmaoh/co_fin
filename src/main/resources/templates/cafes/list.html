<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('咖啡廳')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="page">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="page-header">
        <h1>咖啡廳</h1>
        <a class="button" th:href="@{/cafes/new}">＋ 新增咖啡廳</a>
    </div>

    <form class="inline-form" th:action="@{/cafes}" method="get">
        <input type="text" name="q" th:value="${q}" placeholder="搜尋店名" aria-label="搜尋店名">
        <input type="hidden" name="tag" th:if="${tag}" th:value="${tag}">
        <button type="submit">搜尋</button>
    </form>

    <div class="chips filter" th:unless="${popularTags.isEmpty()}">
        <a class="chip" th:classappend="${tag == null} ? 'active'" th:href="@{/cafes(q=${q})}">全部</a>
        <a th:each="t : ${popularTags}" class="chip"
           th:classappend="${t.name() == tag} ? 'active'"
           th:href="@{/cafes(q=${q},tag=${t.name()})}">
            <span th:text="'#' + ${t.name()}">tag</span>
            <span class="count" th:text="${t.count()}">1</span>
        </a>
    </div>
    <p class="muted" th:if="${tag}">
        篩選標籤：<strong th:text="'#' + ${tag}">tag</strong>
        <a th:href="@{/cafes(q=${q})}">清除</a>
    </p>

    <section class="panel">
        <p class="empty" th:if="${cafes.isEmpty()}">
            還沒有符合條件的咖啡廳。<a th:href="@{/cafes/new}">新增一家？</a>
        </p>
        <ul class="item-list" th:unless="${cafes.isEmpty()}">
            <li th:each="c : ${cafes}">
                <div>
                    <a class="item-title" th:href="@{/cafes/{id}(id=${c.id()})}" th:text="${c.name()}">店名</a>
                    <div class="muted" th:if="${c.address()}" th:text="${c.address()}">地址</div>
                    <div class="chips" th:unless="${c.tags().isEmpty()}">
                        <span class="chip" th:each="t : ${c.tags()}">
                            <span th:text="'#' + ${t.name()}">tag</span>
                            <span class="count" th:text="${t.count()}">1</span>
                        </span>
                    </div>
                </div>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
