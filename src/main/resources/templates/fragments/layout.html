<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Co-Fin'">Co-Fin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/}">☕ Co-Fin</a>
    <nav>
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/collections}">我的清單</a>
        <a th:href="@{/search}">搜尋</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/cafes}">審核</a>
    </nav>
    <div class="me">
        <span sec:authentication="name">user</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="link">登出</button>
        </form>
    </div>
</header>

<!-- Only rendered when a Google Maps key is configured. maps.js must load before Google calls back into it. -->
<th:block th:fragment="mapsScripts">
    <th:block th:if="${mapsApiKey}">
        <script th:src="@{/js/maps.js}"></script>
        <script async
                th:src="@{https://maps.googleapis.com/maps/api/js(key=${mapsApiKey},loading='async',callback='coFinMapsReady',language='zh-TW',region='TW')}"></script>
    </th:block>
</th:block>

<!-- Rating as stars, e.g. ★★★★☆ -->
<span th:fragment="stars(value)" class="stars"
      th:text="${#strings.repeat('★', value)} + ${#strings.repeat('☆', 5 - value)}"
      th:attr="aria-label=${value} + ' 顆星'">★★★★★</span>

<div th:fragment="flash">
    <p th:if="${message}" class="notice success" th:text="${message}"></p>
    <p th:if="${error}" class="notice error" th:text="${error}"></p>
</div>

</body>
</html>
