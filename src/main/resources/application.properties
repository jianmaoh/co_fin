spring.application.name=co-fin

# 12-factor: every environment-specific value comes from an env var.
# The defaults match compose.yaml for local Postgres.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cofin}
spring.datasource.username=${DB_USER:cofin}
spring.datasource.password=${DB_PASSWORD:cofin}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Comma-separated usernames that get the admin (developer) role.
cofin.admin-usernames=${ADMIN_USERNAMES:}

# Browser key for Google Maps. Leave empty to fall back to typing cafes in by hand.
cofin.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}
# Optional Map ID with a custom style (see docs/map-style.md); without it a built-in dark theme is used.
cofin.google-maps.map-id=${GOOGLE_MAPS_MAP_ID:}

# Review photos: each file up to 5 MB, at most 3 per review.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
