# Local development without Docker: embedded H2 stored under ./data.
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:file:./data/cofin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.thymeleaf.cache=false
