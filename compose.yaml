services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cofin
      POSTGRES_USER: cofin
      POSTGRES_PASSWORD: cofin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofin -d cofin"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cofin
      DB_USER: cofin
      DB_PASSWORD: cofin
      # Read from the .env file next to this compose.yaml (never committed).
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
